nodeLinker: node-modules

# `sharp` embarque des binaires natifs par plateforme. Sans cette liste, le lockfile ne
# contient que ceux de la machine de développement (macOS), et le build Vercel — qui tourne
# sous linux-x64 — échoue au chargement du module.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
