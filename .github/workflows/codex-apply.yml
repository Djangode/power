name: Apply verified Codex patch

on:
  push:
    branches: [main]
    paths:
      - .github/codex-secure.patch
      - .github/workflows/codex-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'ibaricyril2111-cell'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git config user.name "Power Codex"
          git config user.email "ibaricyril2111@gmail.com"
          git apply --check .github/codex-secure.patch
          git apply .github/codex-secure.patch
          git add app components lib middleware.ts prisma public auth.ts
          git commit -m "security: lock owner access and harden public flows"
          git push origin HEAD:main
